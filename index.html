<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한 가지 물어볼 게 있어... ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffe6e9;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #e63946;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .btn-group {
            margin-top: 30px;
            position: relative;
            height: 60px;
        }
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            margin-right: 15px;
        }
        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #c9184a;
        }
        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: absolute;
        }
        .gift-container {
            display: none;
            margin-top: 20px;
        }
        .gift-buttons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 10px;
        }
        .gift-btn {
            background-color: #ffb703;
            color: white;
            border-radius: 15px;
            padding: 10px 15px;
            flex: 1;
        }
        .gift-btn:hover {
            background-color: #fb8500;
        }
        .music-player {
            margin-top: 20px;
            display: none;
        }
        iframe {
            width: 100%;
            height: 215px;
            border-radius: 12px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="question">나랑 사귈래? 🌹</h1>
        
        <div class="btn-group" id="initialButtons">
            <button id="yesBtn" onclick="acceptProposal()">네! ❤️</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">아니오 😜</button>
        </div>

        <div class="gift-container" id="giftSection">
            <p style="font-size: 1.1rem; color: #555;">좋은 선택이야! 🎉 너를 위해 선물 3가지를 준비했어. 하나 골라봐! 🎁</p>
            <div class="gift-buttons">
                <button class="gift-btn" onclick="playSong('CuT0bF03mGg')">선물 1 🎁</button>
                <button class="gift-btn" onclick="playSong('HZX7MB_m13M')">선물 2 🎁</button>
                <button class="gift-btn" onclick="playSong('-qItgWRKFXA')">선물 3 🎁</button>
            </div>
            <div class="music-player" id="playerContainer">
                <iframe id="youtubePlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function acceptProposal() {
            document.getElementById('question').innerText = "내 마음을 받아줘서 고마워 ❤️";
            document.getElementById('initialButtons').style.display = 'none';
            document.getElementById('giftSection').style.display = 'block';
        }

        function playSong(videoId) {
            const playerContainer = document.getElementById('playerContainer');
            const iframe = document.getElementById('youtubePlayer');
            iframe.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
            playerContainer.style.display = 'block';
        }
    </script>
</body>
</html>
